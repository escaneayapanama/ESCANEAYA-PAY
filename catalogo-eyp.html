<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — EscaneaYa Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --color-principal:#0A1F5C;
    --azul:#0A1F5C;--azul-suave:#12296e;--verde:#7ED321;
    --fondo:#F3F5F9;--texto:#16213E;--gris:#7A8194;--borde:#E1E5EE;--card:#fff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins',sans-serif;background:var(--fondo);color:var(--texto);min-height:100vh;padding-bottom:80px;}

  /* Header negocio */
  .negocio-header{background:var(--color-principal);padding:28px 20px 24px;text-align:center;color:#fff;}
  .negocio-logo-wrap{width:80px;height:80px;border-radius:18px;background:rgba(255,255,255,0.15);margin:0 auto 14px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:36px;}
  .negocio-logo-wrap img{width:100%;height:100%;object-fit:cover;}
  .negocio-nombre{font-family:'Montserrat',sans-serif;font-weight:900;font-size:22px;margin-bottom:4px;}
  .negocio-subtitulo{font-size:13px;color:rgba(255,255,255,0.7);}
  .btn-whatsapp{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:#25D366;color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;padding:10px 20px;border-radius:999px;text-decoration:none;}

  /* Productos */
  .catalogo-wrap{max-width:600px;margin:0 auto;padding:20px 16px;}
  .catalogo-titulo{font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:14px;}
  .prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .prod-card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .prod-foto{width:100%;aspect-ratio:1;object-fit:cover;background:var(--fondo);display:flex;align-items:center;justify-content:center;font-size:40px;}
  .prod-foto img{width:100%;height:100%;object-fit:cover;}
  .prod-body{padding:12px;}
  .prod-nombre{font-size:13px;font-weight:600;color:var(--texto);margin-bottom:2px;}
  .prod-desc{font-size:11px;color:var(--gris);margin-bottom:8px;line-height:1.4;}
  .prod-precio{font-family:'Montserrat',sans-serif;font-weight:900;font-size:17px;color:var(--color-principal);margin-bottom:10px;}
  .btn-pagar{width:100%;border:none;border-radius:8px;background:var(--color-principal);color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;padding:10px;cursor:pointer;}
  .btn-pagar:hover{opacity:0.9;}

  /* Footer */
  .footer-eyp{text-align:center;padding:20px;font-size:11px;color:var(--gris);}
  .footer-eyp a{color:var(--azul);text-decoration:none;font-weight:600;}

  /* Empty */
  .empty{text-align:center;padding:50px 20px;color:var(--gris);}
  .empty-icon{font-size:48px;margin-bottom:12px;}

  /* Color picker */
  .color-bar{background:#fff;border-bottom:1px solid var(--borde);padding:10px 20px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--gris);max-width:600px;margin:0 auto;}
  .color-opts{display:flex;gap:8px;}
  .color-opt{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .color-opt.active{border-color:var(--texto);}
</style>
</head>
<body>

<div class="negocio-header" id="negocio-header">
  <div class="negocio-logo-wrap" id="negocio-logo">🏪</div>
  <div class="negocio-nombre" id="negocio-nombre">Cargando...</div>
  <div class="negocio-subtitulo">Catálogo de productos</div>
  <a class="btn-whatsapp" id="btn-whatsapp" href="#" target="_blank" style="display:none">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.09.538 4.09 1.485 5.834L.036 23.5l5.818-1.427A11.942 11.942 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.848 0-3.596-.49-5.112-1.348l-.366-.217-3.453.847.876-3.353-.239-.386A9.96 9.96 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
    WhatsApp
  </a>
</div>

<div class="color-bar" id="color-bar" style="display:none">
  <span>Color:</span>
  <div class="color-opts">
    <div class="color-opt active" style="background:#0A1F5C" onclick="cambiarColor('#0A1F5C',this)"></div>
    <div class="color-opt" style="background:#7ED321" onclick="cambiarColor('#7ED321',this)"></div>
    <div class="color-opt" style="background:#E74C3C" onclick="cambiarColor('#E74C3C',this)"></div>
    <div class="color-opt" style="background:#8E44AD" onclick="cambiarColor('#8E44AD',this)"></div>
    <div class="color-opt" style="background:#E67E22" onclick="cambiarColor('#E67E22',this)"></div>
    <div class="color-opt" style="background:#1ABC9C" onclick="cambiarColor('#1ABC9C',this)"></div>
    <div class="color-opt" style="background:#2C3E50" onclick="cambiarColor('#2C3E50',this)"></div>
  </div>
</div>

<div class="catalogo-wrap">
  <div class="catalogo-titulo" id="catalogo-titulo">Productos</div>
  <div class="prod-grid" id="prod-grid">
    <div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">🛍️</div>
      <div>Este negocio aún no tiene productos.</div>
    </div>
  </div>
</div>

<div class="footer-eyp">
  Powered by <a href="/registro-eyp.html">EscaneaYa Pay</a> · <a href="/registro-eyp.html">¿Quieres cobrar así? Regístrate gratis</a>
</div>

<script>
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzEAKsVXBoVUxh9b1f-EL1dGbRZKdBUJ1J6vdKNuuUIP3ot9pmQXbPi8WxF_0SmstQgQ/exec";
var params = new URLSearchParams(window.location.search);
var negocioEmail = params.get('negocio') || '';
var esAdmin = params.get('admin') === '1';
var negocioInfo = null;

if (esAdmin) {
  document.getElementById('color-bar').style.display = 'flex';
}

// Cargar datos del negocio
if (negocioEmail) {
  var cb = 'cat_' + Date.now();
  window[cb] = function(r) {
    if (r && r.ok) {
      negocioInfo = r.negocio;
      mostrarNegocio(r.negocio);
      mostrarProductos(r.productos || []);
    }
    delete window[cb];
    if (document.body.contains(sc)) document.body.removeChild(sc);
  };
  var sc = document.createElement('script');
  sc.src = APPS_SCRIPT_URL + "?action=getCatalogoEYP&callback=" + cb + "&email=" + encodeURIComponent(negocioEmail);
  document.body.appendChild(sc);
}

function mostrarNegocio(n) {
  document.title = n.negocio + ' — Catálogo';
  document.getElementById('negocio-nombre').textContent = n.negocio;
  if (n.logo) {
    document.getElementById('negocio-logo').innerHTML = '<img src="' + n.logo + '" onerror="this.parentElement.innerHTML=\'🏪\'">';
  }
  if (n.whatsapp) {
    var wa = document.getElementById('btn-whatsapp');
    wa.href = 'https://wa.me/' + String(n.whatsapp).replace(/[^0-9]/g, '');
    wa.style.display = 'inline-flex';
  }
  if (n.color) cambiarColor(n.color, null);
  document.getElementById('catalogo-titulo').textContent = 'Catálogo de ' + n.negocio;
}

function mostrarProductos(prods) {
  var grid = document.getElementById('prod-grid');
  if (!prods || !prods.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🛍️</div><div>Este negocio aún no tiene productos.</div></div>';
    return;
  }
  grid.innerHTML = '';
  prods.forEach(function(p) {
    var card = document.createElement('div');
    card.className = 'prod-card';
    var fotoHtml = p.foto
      ? '<div class="prod-foto"><img src="' + p.foto + '" onerror="this.parentElement.innerHTML=\'🛍️\'"></div>'
      : '<div class="prod-foto">🛍️</div>';
    card.innerHTML = fotoHtml +
      '<div class="prod-body">' +
        '<div class="prod-nombre">' + p.nombre + '</div>' +
        (p.desc ? '<div class="prod-desc">' + p.desc + '</div>' : '') +
        '<div class="prod-precio">$' + parseFloat(p.precio).toFixed(2) + '</div>' +
        '<button class="btn-pagar" onclick="pagarProducto(\'' + encodeURIComponent(p.nombre) + '\',' + p.precio + ')">💳 Pagar</button>' +
      '</div>';
    grid.appendChild(card);
  });
}

function pagarProducto(nombreEnc, precio) {
  var link = 'https://www.escaneaya.com/escanea-y-paga.html?negocio=' + encodeURIComponent(negocioInfo.negocio) +
    '&email=' + encodeURIComponent(negocioEmail) +
    '&monto=' + precio.toFixed(2) +
    '&concepto=' + nombreEnc;
  window.location.href = link;
}

function cambiarColor(color, el) {
  document.documentElement.style.setProperty('--color-principal', color);
  document.getElementById('negocio-header').style.background = color;
  document.querySelectorAll('.color-opt').forEach(function(o) { o.classList.remove('active'); });
  if (el) el.classList.add('active');
}
</script>
</body>
</html>
