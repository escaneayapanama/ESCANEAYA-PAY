<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado del Pago - EscaneaYa Pay</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --fg: #1a1a2e;
      --muted: #6b7280;
      --accent: #6c63ff;
      --accent2: #00b894;
      --border: #e5e7eb;
      --success: #00b894;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 4px 24px rgba(108,99,255,0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f0f1a; --card: #1a1a2e; --fg: #f0f0ff;
        --muted: #9ca3af; --border: #2d2d44;
        --shadow: 0 4px 24px rgba(0,0,0,0.4); color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f0f1a; --card: #1a1a2e; --fg: #f0f0ff;
      --muted: #9ca3af; --border: #2d2d44;
      --shadow: 0 4px 24px rgba(0,0,0,0.4); color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 40px 28px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .status-icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: pop 0.5s ease;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      80% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .status-titulo {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .status-titulo.success { color: var(--success); }
    .status-titulo.danger  { color: var(--danger); }
    .status-titulo.warning { color: var(--warning); }
    .status-sub {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .info-box {
      background: var(--bg);
      border-radius: 14px;
      padding: 18px;
      text-align: left;
      margin-bottom: 24px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .key { color: var(--muted); }
    .info-row .val { font-weight: 600; text-align: right; }
    .val.monto { font-size: 20px; color: var(--accent); }
    .btn-volver {
      display: inline-block;
      padding: 14px 28px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.2s;
    }
    .btn-volver:hover { opacity: 0.9; }
    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }
    .logo-text span { color: var(--accent2); }
    .procesando {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-text">EscaneaYa<span>Pay</span></div>
    <div id="contenido">
      <div class="procesando">
        <div class="loader"></div>
        <p style="color:var(--muted);font-size:14px">Procesando resultado...</p>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get('code');        // 1 = aprobado, 2 = denegado, 3 = error
    // Para el split: Tilopay necesita el tpt (ID numérico interno de Tilopay)
    const orderId = params.get('tpt') || params.get('tilopay-transaction') || params.get('order');
    const returnDataB64 = params.get('returnData') || '';

    // Decodificar returnData (base64 JSON con info de la transacción)
    let txInfo = {};
    try {
      txInfo = JSON.parse(atob(returnDataB64));
    } catch(e) {}

    async function procesarResultado() {
      const contenido = document.getElementById('contenido');

      // Código 1 = pago aprobado
      if (code === '1') {
        // Llamar al split para liquidar entre negocio y EscaneaYa
        let splitOk = false;
        try {
          const res = await fetch('/api/tilopay-split', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              orderId,
              negocioEmail: txInfo.negocioEmail,
              montoNegocio: txInfo.montoNegocio,
              orderNumber: txInfo.orderNumber,
              returnData: returnDataB64
            })
          });
          const data = await res.json();
          splitOk = data.ok;
        } catch(e) {
          console.warn('Split warning:', e.message);
        }

        // Mostrar pantalla de éxito
        contenido.innerHTML = `
          <div class="status-icon">✅</div>
          <div class="status-titulo success">¡Pago aprobado!</div>
          <div class="status-sub">Tu pago fue procesado exitosamente.</div>
          <div class="info-box">
            <div class="info-row">
              <span class="key">Negocio</span>
              <span class="val">${txInfo.negocioNombre || 'EscaneaYa Pay'}</span>
            </div>
            <div class="info-row">
              <span class="key">Total pagado</span>
              <span class="val monto">$${parseFloat(txInfo.montoTotal || 0).toFixed(2)}</span>
            </div>
            <div class="info-row">
              <span class="key">Orden</span>
              <span class="val" style="font-size:12px">${txInfo.orderNumber || orderId || '—'}</span>
            </div>
            <div class="info-row">
              <span class="key">Estado</span>
              <span class="val" style="color:var(--success)">✔ Aprobado</span>
            </div>
          </div>
          <p style="font-size:13px;color:var(--muted);margin-bottom:20px">
            Guarda esta pantalla como comprobante de pago.
          </p>
          <button class="btn-volver" onclick="window.close()">Listo</button>
        `;

      } else if (code === '2') {
        // Pago denegado
        contenido.innerHTML = `
          <div class="status-icon">❌</div>
          <div class="status-titulo danger">Pago denegado</div>
          <div class="status-sub">Tu tarjeta no fue autorizada. Intenta con otra tarjeta.</div>
          <div class="info-box">
            <div class="info-row">
              <span class="key">Motivo</span>
              <span class="val">Tarjeta no autorizada</span>
            </div>
            <div class="info-row">
              <span class="key">Orden</span>
              <span class="val" style="font-size:12px">${txInfo.orderNumber || orderId || '—'}</span>
            </div>
          </div>
          <button class="btn-volver" onclick="history.back()">← Volver e intentar de nuevo</button>
        `;

      } else {
        // Código 3 u otro: error/cancelado
        contenido.innerHTML = `
          <div class="status-icon">⚠️</div>
          <div class="status-titulo warning">Pago cancelado</div>
          <div class="status-sub">El pago fue cancelado o hubo un problema. No se realizó ningún cobro.</div>
          <button class="btn-volver" onclick="history.back()">← Volver</button>
        `;
      }
    }

    // Ejecutar al cargar
    procesarResultado();
  </script>
</body>
</html>
