<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EscaneaYa Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#0A1F5C;--azul-suave:#12296e;--verde:#7ED321;--verde-oscuro:#5FA818;
    --fondo:#F3F5F9;--texto:#16213E;--gris:#7A8194;--borde:#E1E5EE;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins',sans-serif;background:var(--fondo);color:var(--texto);
    display:flex;justify-content:center;padding:32px 16px;min-height:100vh;}
  .card{width:100%;max-width:420px;background:#fff;border-radius:20px;
    box-shadow:0 20px 50px rgba(10,31,92,0.10);overflow:hidden;}
  .header{background:linear-gradient(135deg,var(--azul) 0%,var(--azul-suave) 100%);
    padding:28px 28px 24px;color:#fff;}
  .negocio{margin-top:18px;font-size:13px;color:#B9C2E8;}
  .negocio strong{display:block;color:#fff;font-size:19px;font-family:'Montserrat',sans-serif;
    font-weight:800;margin-top:2px;}
  .monto-box{margin-top:22px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
    border-radius:14px;padding:16px 18px;}
  .monto-box .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#B9C2E8;}
  .monto-box .valor{font-family:'Montserrat',sans-serif;font-weight:900;font-size:34px;margin-top:4px;
    display:flex;align-items:baseline;gap:6px;}
  .monto-box .valor span{font-size:16px;font-weight:600;color:var(--verde);}
  .body{padding:26px 28px 28px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--gris);margin-bottom:6px;}
  fieldset{border:none;padding:0;margin:0 0 14px;}
  input{width:100%;border:1.5px solid var(--borde);border-radius:10px;padding:13px 14px;
    font-size:14.5px;color:var(--texto);background:#FBFCFE;font-family:'Poppins',sans-serif;}
  input:focus{outline:none;border-color:var(--azul);}
  .fila-doble{display:flex;gap:12px;}
  .fila-doble>div{flex:1;}
  .seccion-titulo{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--azul);border-bottom:1px solid var(--borde);padding-bottom:8px;margin:18px 0 14px;}
  .btn-pagar{width:100%;border:none;border-radius:12px;background:var(--verde);color:var(--azul);
    font-family:'Montserrat',sans-serif;font-weight:800;font-size:15.5px;padding:16px;margin-top:8px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-pagar:hover{background:var(--verde-oscuro);color:#fff;}
  .btn-pagar:disabled{opacity:0.6;cursor:not-allowed;}
  .seguridad{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:11.5px;color:var(--gris);}
  #mensaje-estado{margin-top:12px;font-size:13px;text-align:center;min-height:20px;}
  .marca-wrap{display:flex;align-items:center;gap:10px;}
  .logo-icono{width:64px;height:64px;border-radius:12px;flex-shrink:0;}
  .marca-sub{font-size:9.5px;color:#8C9BD6;text-transform:uppercase;letter-spacing:0.6px;}
  .marca-nombre{font-family:'Montserrat',sans-serif;font-weight:900;font-size:15px;letter-spacing:0.5px;margin-top:2px;}
  .loading-text{text-align:center;color:var(--gris);font-size:13px;padding:20px 0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spinner{width:16px;height:16px;border:2px solid #E1E5EE;border-top-color:var(--azul);
    border-radius:50%;display:inline-block;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:6px;}
</style>
</head>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://app.tilopay.com/sdk/v1/sdk.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════
   CONFIGURACIÓN
═══════════════════════════════════════════════════════ */
var APPS_URL = "https://script.google.com/macros/s/AKfycbw5b1QdZsR3JTS4Q8BCIBXIbAb-Sw4ZJWzBVaxLpugFTUGGt_ukcKpsLXe5xOjwJbQ/exec";
var params       = new URLSearchParams(window.location.search);
var NEGOCIO      = params.get('negocio') || '';
var MONTO        = parseFloat(params.get('monto')) || 0;
var MONTO_LIBRE  = !params.get('monto');
var EMAIL_NEG    = params.get('email') || '';
var ORDEN_UNICA  = "EYP-" + Date.now();
var TOKEN        = null;
var SDK_LISTO    = false;

/* ═══════════════════════════════════════════════════════
   ALIAS (link corto /p/alias)
═══════════════════════════════════════════════════════ */
var alias = params.get('alias') || '';
var extra = params.get('extra') || '';

if (alias) {
  var cbAlias = 'eyp_alias_' + Date.now();
  window[cbAlias] = function(r) {
    if (r && r.ok) {
      NEGOCIO   = r.negocio;
      EMAIL_NEG = r.correo;
      if (extra) {
        var m = parseFloat(extra);
        if (!isNaN(m) && m > 0) { MONTO = m; MONTO_LIBRE = false; }
      }
    }
    renderHeader();
    cargarToken();
    delete window[cbAlias];
  };
  var scAlias = document.createElement('script');
  scAlias.onerror = function() { renderHeader(); cargarToken(); };
  scAlias.src = APPS_URL + "?action=getNegocioPorAlias&callback=" + cbAlias + "&alias=" + encodeURIComponent(alias);
  document.body.appendChild(scAlias);
} else {
  renderHeader();
  cargarToken();
}

function renderHeader() {
  document.getElementById('nombre-negocio').textContent = NEGOCIO || '—';
  document.getElementById('monto-visible').innerHTML = '$' + (MONTO||0).toFixed(2) + ' <span>USD</span>';
  if (MONTO_LIBRE) {
    document.getElementById('monto-libre-wrap').style.display = 'block';
    document.getElementById('monto-visible').style.display = 'none';
  }
}

/* ═══════════════════════════════════════════════════════
   TOKEN — con caché de 3 minutos en localStorage
═══════════════════════════════════════════════════════ */
function cargarToken() {
  // Intentar caché
  try {
    var c = JSON.parse(localStorage.getItem('eyp_tok') || 'null');
    if (c && c.exp && new Date(c.exp) > new Date()) {
      TOKEN = c.tok;
      mostrarFormulario();
      return;
    }
  } catch(e) {}

  // Pedir token fresco al Apps Script
  var cb = 'eyp_tok_' + Date.now();
  var sc = document.createElement('script');

  window[cb] = function(data) {
    delete window[cb];
    if (sc.parentNode) sc.parentNode.removeChild(sc);

    if (!data || !data.access_token) {
      document.getElementById('loading-text').innerHTML =
        '<span style="color:#C0392B">⚠️ No se pudo conectar con el procesador de pago. Recarga la página.</span>';
      return;
    }
    TOKEN = data.access_token;
    try {
      localStorage.setItem('eyp_tok', JSON.stringify({
        tok: TOKEN,
        exp: new Date(Date.now() + 170000).toISOString()  // 2 min 50 seg
      }));
    } catch(e) {}
    mostrarFormulario();
  };

  sc.onerror = function() {
    document.getElementById('loading-text').innerHTML =
      '<span style="color:#C0392B">⚠️ Error de red. Verifica tu conexión y recarga.</span>';
  };
  sc.src = APPS_URL + "?action=getTilopayToken&callback=" + cb;
  document.body.appendChild(sc);
}

/* ═══════════════════════════════════════════════════════
   MOSTRAR FORMULARIO + PRE-INIT DEL SDK
═══════════════════════════════════════════════════════ */
function mostrarFormulario() {
  document.getElementById('loading-text').style.display = 'none';
  var form = document.getElementById('form-pago');
  form.style.visibility = 'visible';
  form.style.height     = 'auto';
  form.style.overflow   = 'visible';
  console.log('[EYP] Formulario visible, iniciando SDK...');

  // Init del SDK ahora que los campos son visibles en el DOM
  requestAnimationFrame(function() {
    setTimeout(function() {
      console.log('[EYP] tlpy_cc_number:', document.getElementById('tlpy_cc_number'));
      console.log('[EYP] tlpy_cc_expiration_date:', document.getElementById('tlpy_cc_expiration_date'));
      console.log('[EYP] tlpy_cvv:', document.getElementById('tlpy_cvv'));
      console.log('[EYP] tlpy_payment_method:', document.getElementById('tlpy_payment_method'));
      console.log('[EYP] tlpy_saved_cards:', document.getElementById('tlpy_saved_cards'));
      console.log('[EYP] responseTilopay:', document.getElementById('responseTilopay'));
      console.log('[EYP] form-pago tag:', document.getElementById('form-pago').tagName);
      Tilopay.Init({
        token:            TOKEN,
        currency:         "USD",
        language:         "es",
        amount:           MONTO || 1,
        billToEmail:      "cliente@ejemplo.com",
        billToFirstName:  "Cliente",
        billToLastName:   "Cliente",
        billToAddress:    "Panama",
        billToCity:       "Panama",
        billToState:      "Panama",
        billToZipPostCode:"00001",
        billToCountry:    "PA",
        orderNumber:      ORDEN_UNICA,
        capture:          1,
        subscription:     0,
        redirect:         window.location.origin + "/gracias-pago.html"
      }).then(function() {
        SDK_LISTO = true;
        console.log('[EYP] SDK Init OK');
      }).catch(function(e) {
        console.warn('[EYP] SDK Init warn:', e);
      });
    }, 200);
  });
}

/* ═══════════════════════════════════════════════════════
   FORMATO AUTOMÁTICO VENCIMIENTO
═══════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', function() {
  var expInput = document.getElementById('tlpy_cc_expiration_date');
  if (expInput) {
    expInput.addEventListener('input', function(e) {
      var v = e.target.value.replace(/\D/g,'');
      if (v.length >= 2) v = v.slice(0,2) + '/' + v.slice(2,4);
      e.target.value = v;
    });
  }
});

/* ═══════════════════════════════════════════════════════
   FUNCIÓN PAGAR
═══════════════════════════════════════════════════════ */
async function pagar() {
  var boton = document.getElementById('btn-pagar');

  // Validaciones
  if (!TOKEN) { mostrarError("Espera un momento, cargando..."); return; }

  if (MONTO_LIBRE) {
    MONTO = parseFloat(document.getElementById('monto-input-libre').value);
    if (!MONTO || MONTO <= 0) { mostrarError('Ingresa un monto válido.'); return; }
  }
  var nombre = document.getElementById('nombre-cliente').value.trim();
  var correo = document.getElementById('correo-cliente').value.trim();
  if (!nombre) { mostrarError("Ingresa el nombre en la tarjeta."); return; }
  if (!correo || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
    mostrarError("Ingresa un correo electrónico válido."); return;
  }

  // Bloquear botón
  boton.disabled = true;
  boton.innerHTML = '<span class="spinner"></span>Procesando...';
  document.getElementById('mensaje-estado').textContent = '';

  // Guardar datos para gracias-pago.html
  try {
    sessionStorage.setItem('eyp_correo', correo);
    sessionStorage.setItem('eyp_nombre', nombre);
  } catch(e) {}

  // Timeout de seguridad 30s
  var timeout = setTimeout(function() {
    if (boton.disabled) {
      boton.disabled = false;
      boton.innerHTML = "🔒 Pagar ahora";
      mostrarError("El pago tardó demasiado. Si fuiste cobrado, contacta soporte.");
    }
  }, 30000);

  try {
    var partes = nombre.split(' ');
    var primerNombre = partes[0] || 'Cliente';
    var apellido = partes.slice(1).join(' ').trim() || 'Cliente';
    var redirect = window.location.origin + "/gracias-pago.html"
      + "?negocio="      + encodeURIComponent(NEGOCIO)
      + "&monto="        + MONTO
      + "&orden="        + ORDEN_UNICA
      + "&email_negocio="+ encodeURIComponent(EMAIL_NEG)
      + "&correo="       + encodeURIComponent(correo)
      + "&nombre="       + encodeURIComponent(nombre);

    // Si el SDK no se pre-inicializó, Init completo
    if (!SDK_LISTO) {
      await Tilopay.Init({
        token:            TOKEN,
        currency:         "USD",
        language:         "es",
        amount:           MONTO,
        billToEmail:      correo,
        billToFirstName:  primerNombre,
        billToLastName:   apellido,
        billToAddress:    "Panama",
        billToCity:       "Panama",
        billToState:      "Panama",
        billToZipPostCode:"00001",
        billToCountry:    "PA",
        orderNumber:      ORDEN_UNICA,
        capture:          1,
        subscription:     0,
        redirect:         redirect
      });
      SDK_LISTO = true;
    } else {
      // Actualizar datos reales del cliente
      await Tilopay.updateOptions({
        amount:          MONTO,
        billToEmail:     correo,
        billToFirstName: primerNombre,
        billToLastName:  apellido,
        orderNumber:     ORDEN_UNICA,
        subscription:    0,
        redirect:        redirect
      });
    }

    var respuesta = await Tilopay.startPayment();
    clearTimeout(timeout);

    if (respuesta && respuesta.message && respuesta.message !== "Success") {
      mostrarError(respuesta.message);
      boton.disabled = false;
      boton.innerHTML = "🔒 Pagar ahora";
    }
    // Si es exitoso, Tilopay redirige automáticamente
  } catch(e) {
    clearTimeout(timeout);
    console.log('[EYP] Error en pago:', e);
    mostrarError("Error al procesar. Intenta de nuevo.");
    boton.disabled = false;
    boton.innerHTML = "🔒 Pagar ahora";
  }
}

function mostrarError(msg) {
  var el = document.getElementById('mensaje-estado');
  el.style.color = '#C0392B';
  el.textContent = msg;
}
</script>
</body>
