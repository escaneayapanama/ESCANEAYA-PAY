<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EscaneaYa Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#0A1F5C;--azul-suave:#12296e;--verde:#7ED321;--verde-oscuro:#5FA818;
    --fondo:#F3F5F9;--texto:#16213E;--gris:#7A8194;--borde:#E1E5EE;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins',sans-serif;background:var(--fondo);color:var(--texto);
    display:flex;justify-content:center;padding:32px 16px;min-height:100vh;}
  .card{width:100%;max-width:420px;background:#fff;border-radius:20px;
    box-shadow:0 20px 50px rgba(10,31,92,0.10);overflow:hidden;}
  .header{background:linear-gradient(135deg,var(--azul) 0%,var(--azul-suave) 100%);
    padding:28px 28px 24px;color:#fff;}
  .negocio{margin-top:18px;font-size:13px;color:#B9C2E8;}
  .negocio strong{display:block;color:#fff;font-size:19px;font-family:'Montserrat',sans-serif;
    font-weight:800;margin-top:2px;}
  .monto-box{margin-top:22px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
    border-radius:14px;padding:16px 18px;}
  .monto-box .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#B9C2E8;}
  .monto-box .valor{font-family:'Montserrat',sans-serif;font-weight:900;font-size:34px;margin-top:4px;
    display:flex;align-items:baseline;gap:6px;}
  .monto-box .valor span{font-size:16px;font-weight:600;color:var(--verde);}
  .body{padding:26px 28px 28px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--gris);margin-bottom:6px;}
  fieldset{border:none;padding:0;margin:0 0 14px;}
  input{width:100%;border:1.5px solid var(--borde);border-radius:10px;padding:13px 14px;
    font-size:14.5px;color:var(--texto);background:#FBFCFE;font-family:'Poppins',sans-serif;}
  input:focus{outline:none;border-color:var(--azul);}
  .fila-doble{display:flex;gap:12px;}
  .fila-doble>div{flex:1;}
  .seccion-titulo{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--azul);border-bottom:1px solid var(--borde);padding-bottom:8px;margin:18px 0 14px;}
  .btn-pagar{width:100%;border:none;border-radius:12px;background:var(--verde);color:var(--azul);
    font-family:'Montserrat',sans-serif;font-weight:800;font-size:15.5px;padding:16px;margin-top:8px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-pagar:hover{background:var(--verde-oscuro);color:#fff;}
  .btn-pagar:disabled{opacity:0.6;cursor:not-allowed;}
  .seguridad{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:11.5px;color:var(--gris);}
  #mensaje-estado{margin-top:12px;font-size:13px;text-align:center;}
  .marca-wrap{display:flex;align-items:center;gap:10px;}
  .logo-icono{width:64px;height:64px;border-radius:12px;flex-shrink:0;}
  .marca-sub{font-size:9.5px;color:#8C9BD6;text-transform:uppercase;letter-spacing:0.6px;}
  .marca-nombre{font-family:'Montserrat',sans-serif;font-weight:900;font-size:15px;letter-spacing:0.5px;margin-top:2px;}
  .loading-text{text-align:center;color:var(--gris);font-size:13px;padding:20px 0;}
</style>
</head>

      <div>
        <div class="marca-sub">un producto de EscaneaYa</div>
        <div class="marca-nombre">EscaneaYa Pay</div>
      </div>
    </div>
    <div class="negocio">Vas a pagarle a <strong id="nombre-negocio"></strong></div>
    <div class="monto-box">
      <div class="label">Monto a pagar</div>
      <div class="valor" id="monto-visible">$... <span>USD</span></div>
    </div>
    <div id="monto-libre-wrap" style="display:none;margin-top:16px;padding:0 0 4px">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#B9C2E8">Ingresa el monto</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:8px">
        <span style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:28px;color:#fff">$</span>
        <input type="number" id="monto-input-libre" placeholder="0.00" min="0.01" step="0.01" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);border-radius:10px;padding:10px 14px;color:#fff;font-family:'Montserrat',sans-serif;font-weight:900;font-size:24px;width:160px;outline:none">
      </div>
    </div>
  </div>

  <div class="body">
    <div id="loading-text" class="loading-text">Preparando pago seguro...</div>
    <div id="form-pago" class="payFormTilopay" style="display:none">
      <select name="method" id="method" style="display:none"></select>
      <div class="seccion-titulo">💳 Datos de la tarjeta</div>
      <fieldset>
        <label>Nombre en la tarjeta</label>
        <input type="text" id="nombre-cliente" placeholder="Juan Pérez">
      </fieldset>
      <fieldset>
        <label>Número de tarjeta</label>
        <input type="text" id="ccnumber" name="ccnumber" placeholder="•••• •••• •••• ••••" maxlength="19">
      </fieldset>
      <div class="fila-doble">
        <div>
          <fieldset>
            <label>Vencimiento</label>
            <input type="text" id="expdate" name="expdate" placeholder="MM/AA" maxlength="5">
          </fieldset>
        </div>
        <div>
          <fieldset>
            <label>CVV</label>
            <input type="text" id="cvv" name="cvv" placeholder="•••" maxlength="4">
          </fieldset>
        </div>
      </div>

      <div class="seccion-titulo">📄 Datos de factura</div>
      <fieldset>
        <label>Correo electrónico</label>
        <input type="email" id="correo-cliente" placeholder="tucorreo@ejemplo.com">
      </fieldset>

      <button class="btn-pagar" id="btn-pagar" onclick="pagar()">🔒 Pagar ahora</button>
    </div>

    <div id="mensaje-estado"></div>
    <div class="seguridad">🔒 Pago seguro · EscaneaYa Pay</div>
  </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://app.tilopay.com/sdk/v1/sdk.min.js"></script>
<script>
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBQeQxY2jOKz5yjqG5CHwIUForpSjIj7aJhgZz2vgJ-KOWAC01PFRsx7MnYtT6TbrAnQ/exec";
var params = new URLSearchParams(window.location.search);
var NEGOCIO     = params.get('negocio') || 'Mi Negocio';
var MONTO = parseFloat(params.get('monto')) || 0;
var MONTO_LIBRE = !params.get('monto');
var EMAIL_NEGOCIO = params.get('email') || '';
var ORDEN_UNICA = "EYP-" + Date.now();
  // Resolver alias si viene por link corto
var alias = params.get('alias') || '';
var extra = params.get('extra') || '';
if (alias) {
  var cbAlias = 'alias_' + Date.now();
  window[cbAlias] = function(r) {
    if (r && r.ok) {
      NEGOCIO = r.negocio;
      EMAIL_NEGOCIO = r.correo;
      if (extra) {
        var montoExtra = parseFloat(extra);
        if (!isNaN(montoExtra) && montoExtra > 0) {
          MONTO = montoExtra;
          MONTO_LIBRE = false;
         }
      }
    }
    inicializarPagina();
    delete window[cbAlias];
    if (document.body.contains(scAlias)) document.body.removeChild(scAlias);
  };
  var scAlias = document.createElement('script');
  scAlias.src = APPS_SCRIPT_URL + "?action=getNegocioPorAlias&callback=" + cbAlias + "&alias=" + encodeURIComponent(alias);
  scAlias.onerror = function() {
  inicializarPagina();
};
setTimeout(function() {
  if (!EMAIL_NEGOCIO) inicializarPagina();
}, 3000);
document.body.appendChild(scAlias);
  document.body.appendChild(scAlias);
}

function inicializarPagina() {
  inicializarPagina();
delete window[cbAlias];
  document.getElementById('nombre-negocio').textContent = NEGOCIO && NEGOCIO !== 'Mi Negocio' ? NEGOCIO : '...';
  document.getElementById('monto-visible').innerHTML = '$' + MONTO.toFixed(2) + ' <span>USD</span>';
  if (MONTO_LIBRE) {
    document.getElementById('monto-libre-wrap').style.display = 'block';
    document.getElementById('monto-visible').style.display = 'none';
  }
}

var tilopayListo = false;

var TOKEN_TILOPAY = null;

var cbName = 'tilopay_cb_' + Date.now();
window[cbName] = function(data) {
  if (!data || !data.access_token) {
    mostrarError("No se pudo iniciar el pago. Intenta de nuevo.");
    document.getElementById('loading-text').style.display = 'none';
    delete window[cbName];
    return;
  }
  TOKEN_TILOPAY = data.access_token;
  document.getElementById('loading-text').style.display = 'none';
  document.getElementById('form-pago').style.display = 'block';
  if (MONTO_LIBRE) {
  document.getElementById('monto-libre-wrap').style.display = 'block';
  document.getElementById('monto-visible').style.display = 'none';
}
  delete window[cbName];
  if (document.body.contains(sc)) document.body.removeChild(sc);
};

var sc = document.createElement('script');
sc.src = APPS_SCRIPT_URL + "?action=getTilopayToken&callback=" + cbName;
sc.onerror = function() {
  mostrarError("Error de conexión. Intenta de nuevo.");
  document.getElementById('loading-text').style.display = 'none';
};
document.body.appendChild(sc);

function pagar() {
  if (!TOKEN_TILOPAY) {
    mostrarError("Espera un momento...");
    return;
  }
  if (MONTO_LIBRE) {
    MONTO = parseFloat(document.getElementById('monto-input-libre').value);
    if (!MONTO || MONTO <= 0) { mostrarError('Ingresa un monto válido antes de pagar.'); return; }
  }
  var nombreVal = document.getElementById('nombre-cliente').value.trim();
  var correoVal = document.getElementById('correo-cliente').value.trim();

  if (!nombreVal) {
    mostrarError("Por favor ingresa el nombre en la tarjeta.");
    return;
  }
  if (!correoVal || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correoVal)) {
    mostrarError("Por favor ingresa un correo electrónico válido.");
    return;
  }

  var boton = document.getElementById('btn-pagar');
  boton.disabled = true;
  boton.textContent = "Procesando...";

  try {
    sessionStorage.setItem('eyp_correo_cliente', correoVal);
    sessionStorage.setItem('eyp_nombre_cliente', nombreVal);
  } catch(e) {}

var init = Tilopay.Init({
    token: TOKEN_TILOPAY,
    currency: "USD",
    language: "es",
    amount: MONTO,
    billToEmail: 'escaneapagos@gmail.com',
    billToFirstName: nombreVal.split(' ')[0] || 'Cliente',
    billToLastName: nombreVal.split(' ').slice(1).join(' ') || 'Cliente',
    billToAddress: 'Panama',
    billToCity: 'Panama',
    billToState: 'Panama',
    billToZip: '00001',
    billToCountry: 'PA',
    orderNumber: ORDEN_UNICA,
    capture: 1,
    redirect: window.location.origin + "/gracias-pago.html?negocio=" + encodeURIComponent(NEGOCIO) + "&monto=" + MONTO + "&orden=" + ORDEN_UNICA + "&email_negocio=" + encodeURIComponent(EMAIL_NEGOCIO) + "&correo=" + encodeURIComponent(correoVal) + "&nombre=" + encodeURIComponent(nombreVal)
  });
  if (init && init.methods && init.methods.length > 0) {
    var sel = document.getElementById('method');
    sel.innerHTML = '';
    init.methods.forEach(function(m) {
      var opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name;
      sel.appendChild(opt);
    });
  }

  var respuesta = Tilopay.startPayment();
  if (respuesta && respuesta.message && respuesta.message !== "Success") {
    mostrarError(respuesta.message);
    boton.disabled = false;
    boton.innerHTML = "🔒 Pagar ahora";
  }
}
  
function mostrarError(msg) {
  var el = document.getElementById('mensaje-estado');
  el.style.color = '#C0392B';
  el.textContent = msg;
}
</script>
</body>
</html>
